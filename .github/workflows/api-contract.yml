name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# PRは同じ参照の古い実行を取り消す。main・workflow_call（配備）は取り消さない。
concurrency:
  group: quality-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Void types
        run: pnpm exec void prepare
      - name: Format, lint, types, OpenAPI, generated clients, tests and build
        run: pnpm exec vp run verify
