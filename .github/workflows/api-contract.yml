name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      commit_ref:
        description: Exact approved commit for manual preview deployment
        required: false
        type: string
        default: ""

permissions:
  contents: read

# PRは同じ参照の古い実行を取り消す。main・workflow_call（配備）は取り消さない。
concurrency:
  group: quality-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_ref || github.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Void types
        run: pnpm exec void prepare
      - name: Format, lint, types, OpenAPI, generated clients, tests and build
        run: pnpm exec vp run verify
