name: Deploy approved main commit

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment destination
        required: true
        type: choice
        options: [staging, production]
      approved:
        description: I approve deployment of this main commit and its migrations
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    if: github.ref == 'refs/heads/main' && inputs.approved
    uses: ./.github/workflows/api-contract.yml

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      DEPLOYMENT_READY: ${{ vars.DEPLOYMENT_READY }}
      ACCESS_READY: ${{ vars.ACCESS_READY }}
      AUTH_READY: ${{ vars.AUTH_READY }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Check environment configuration before using credentials
        run: node scripts/prepare-deployment.mjs
      - name: Refuse an outdated main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$latest" = "$GITHUB_SHA"
      - run: pnpm install --frozen-lockfile
      - name: Validate environment-specific build
        run: pnpm exec vp run verify
      - name: Deploy and apply committed migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: pnpm exec void deploy --platform cloudflare
      - name: Health check and deployment record
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/check-deployment.mjs
      - name: Report failure
        if: failure()
        run: echo 'Deployment or health check failed. Check the job logs and docs/deployment.md before retrying.' >> "$GITHUB_STEP_SUMMARY"
