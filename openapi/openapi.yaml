openapi: 3.1.0
info:
  title: Roadmap Studio API
  version: 0.1.0
  description: Roadmap Studioフェーズ1のAPI契約の正本。
servers:
  - url: http://localhost:3000/api
tags:
  - name: Workspaces
    description: 共有境界となるWorkspaceとそのメンバー。
  - name: Projects
    description: Workspace配下のプロジェクト。
  - name: Roadmaps
    description: プロジェクト配下のロードマップ。
  - name: Tasks
    description: ロードマップに属するタスク。ボードとタイムラインが共有する。
  - name: Labels
    description: Workspaceに属するラベル。
  - name: Invitations
    description: Workspaceへのメンバー招待。招待の管理はowner/adminだけが行い、受諾は招待先本人が行う。
  - name: MyTasks
    description: ログイン中のユーザーが担当するタスク（マイタスク）。
security:
  - sessionCookie: []
paths:
  /workspaces:
    post:
      operationId: createWorkspace
      summary: Workspaceを作成する
      description: 作成者をownerとして登録し、初期プロジェクト「マイプロジェクト」を作成する。すべてを同一トランザクションで保存する。
      tags: [Workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listWorkspaces
      summary: ログイン中のユーザーが所属するWorkspace一覧
      tags: [Workspaces]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    patch:
      operationId: updateWorkspace
      summary: Workspaceの名称を変更する
      description: owner/adminのみ実行できる。versionが一致しない場合は409。
      tags: [Workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteWorkspace
      summary: Workspaceを削除する
      description: ownerのみ実行できる。配下のProject・Roadmap・Task・Label・招待・メンバーシップも削除する。
      tags: [Workspaces]
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /me/tasks:
    get:
      operationId: listMyTasks
      summary: ログイン中のユーザーが担当するタスク一覧（マイタスク）
      description: |
        担当者がログイン中のユーザーのタスクだけを、所属するWorkspaceの範囲で返す。担当者を指定するパラメータはない。
        アーカイブ済みのProject・Roadmapのタスクは含めない。
        並びは指定したsortとdirection、同値はid昇順で、ページをまたいでも重複・欠落しない。dueDateとstartDate未設定のタスクは常に末尾。
        summaryは検索・絞り込みの条件に影響されず、担当タスク全体から算出する。
      tags: [MyTasks]
      parameters:
        - name: today
          in: query
          required: true
          description: 期限切れ・期限の判定に使う基準日。利用者のタイムゾーンの今日をクライアントが送り、すべての判定と集計で共通に使う。
          schema:
            $ref: "#/components/schemas/CalendarDate"
        - name: q
          in: query
          description: タイトルと説明の部分一致検索。
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          description: 指定したステータスのみ返す。複数指定はOR。
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TaskStatus"
          style: form
          explode: true
        - name: due
          in: query
          description: |
            期限の絞り込み。複数指定はOR。
            overdue=期限がtodayより前で未完了、today=期限がtoday、thisWeek=期限がtoday以降today+6日まで、noDueDate=期限なし。
            overdueとthisWeekに完了タスクは含めない。
          schema:
            type: array
            items:
              $ref: "#/components/schemas/MyTaskDueFilter"
          style: form
          explode: true
        - name: sort
          in: query
          schema:
            type: string
            enum: [dueDate, priority, createdAt, updatedAt]
            default: dueDate
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          description: 1始まりのページ番号。条件を変えたら1に戻す。
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyTaskPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /workspaces/{workspaceId}/invitations:
    get:
      operationId: listInvitations
      summary: Workspaceの招待一覧（招待中・受諾済み・取消・期限切れ）
      description: owner/adminだけが取得できる。新しい順。
      tags: [Invitations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createInvitation
      summary: メールアドレス宛にWorkspaceへの招待を送る
      description: |
        owner/adminだけが行える。有効期限は7日。
        既にメンバーのメールアドレス、既に招待中のメールアドレスは422。期限切れの招待が残っている場合は、取り消して新しい招待を作る。
        応答のinviteUrlは作成時だけ得られる。メール送信に失敗した場合も招待は作成され、inviteUrlを共有できる。
      tags: [Invitations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationIssued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /workspaces/{workspaceId}/invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      summary: 招待中の招待を取り消す
      description: 招待中の招待だけを取り消せる。取り消し済みなら何もせず204。受諾済み・期限切れは422。
      tags: [Invitations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /workspaces/{workspaceId}/invitations/{invitationId}/resend:
    post:
      operationId: resendInvitation
      summary: 招待を再送する
      description: 招待中または期限切れの招待に対し、新しいinviteUrlを発行して有効期限を7日に延ばし、メールを再送する。以前のinviteUrlは使えなくなる。
      tags: [Invitations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationIssued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /invitations/{token}:
    get:
      operationId: getInvitationPreview
      summary: 招待の概要を取得する（受諾画面用）
      description: ログイン中のユーザーが、招待URLのトークンから招待の概要を確認する。招待先のメールアドレスは返さず、本人かどうかだけをemailMatchesで返す。
      tags: [Invitations]
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      summary: 招待を受諾してWorkspaceに参加する
      description: |
        招待先のメールアドレスと、ログイン中のGoogleアカウントのメールアドレスが一致する場合だけ参加できる。一致しなければ403。
        受諾済みの同じ招待を同じユーザーが再度受諾しても、Membershipは重複せず成功する。
        取り消された・期限切れの招待は422で、detailsに理由を返す。
      tags: [Invitations]
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /workspaces/{workspaceId}/members:
    get:
      operationId: listWorkspaceMembers
      summary: Workspaceのメンバー一覧（担当者の選択肢）
      tags: [Workspaces]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/labels:
    get:
      operationId: listLabels
      summary: Workspaceのラベル一覧
      tags: [Labels]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Label"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/projects:
    get:
      operationId: listProjects
      summary: Workspaceのプロジェクト一覧
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
    patch:
      operationId: updateProject
      summary: Projectの名称を変更する
      description: owner/adminのみ実行できる。versionが一致しない場合は409。
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /workspaces/{workspaceId}/projects/{projectId}/roadmaps:
    get:
      operationId: listRoadmaps
      summary: プロジェクト配下のロードマップ一覧
      tags: [Roadmaps]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Roadmap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createRoadmap
      summary: ロードマップを作成する
      tags: [Roadmaps]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoadmapCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roadmap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /workspaces/{workspaceId}/roadmaps/{roadmapId}:
    get:
      operationId: getRoadmap
      summary: ロードマップを取得する
      tags: [Roadmaps]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RoadmapId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roadmap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateRoadmap
      summary: ロードマップを更新する
      tags: [Roadmaps]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RoadmapId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoadmapUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roadmap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /workspaces/{workspaceId}/roadmaps/{roadmapId}/tasks:
    get:
      operationId: listTasks
      summary: ロードマップのタスク一覧（ボード・タイムライン共通）
      description: sort未指定ならsortOrder昇順（同値はid昇順）。ボードは列ごとにstatusで絞って取得する。
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RoadmapId"
        - name: status
          in: query
          description: 指定したステータスのみ返す。複数指定はOR。
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TaskStatus"
          style: form
          explode: true
        - name: assigneeId
          in: query
          schema:
            $ref: "#/components/schemas/Id"
        - name: labelId
          in: query
          description: 指定したラベルのいずれかを持つタスクのみ返す。
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Id"
          style: form
          explode: true
        - name: q
          in: query
          description: タイトルと説明の部分一致検索。
          schema:
            type: string
            maxLength: 200
        - name: sort
          in: query
          schema:
            type: string
            enum: [sortOrder, dueDate, startDate, priority, createdAt]
            default: sortOrder
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: cursor
          in: query
          description: 前回応答のnextCursor。
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: createTask
      summary: タスクを作成する
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RoadmapId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /workspaces/{workspaceId}/roadmaps/{roadmapId}/tasks/{taskId}:
    get:
      operationId: getTask
      summary: タスクを取得する
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RoadmapId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTask
      summary: タスクを更新する（詳細編集・ステータス変更・列内の並べ替え）
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RoadmapId"
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteTask
      summary: タスクを削除する
      description: 紐づくCommentも削除される。
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RoadmapId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Better Authが発行するサーバー側セッションのCookie。HTTPSでは `__Secure-` が先頭に付く。
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    InvitationToken:
      name: token
      in: path
      required: true
      description: 招待URLに含まれる、推測できないトークン。
      schema:
        type: string
        minLength: 20
        maxLength: 100
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    RoadmapId:
      name: roadmapId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
  responses:
    Unauthorized:
      description: 未認証。画面はログインへ誘導する。再試行しない。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthorizedError"
    Forbidden:
      description: Workspaceのメンバーではない、または権限が足りない。再試行しない。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForbiddenError"
    NotFound:
      description: 対象が存在しない、または閲覧権限のない対象。再試行しない。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundError"
    VersionConflict:
      description: 送信したversionが現在値と異なる。再取得してから操作をやり直す。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VersionConflictError"
    ValidationFailed:
      description: 入力が不正。detailsに項目ごとの理由を返す。再試行しない。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationFailedError"
    InternalError:
      description: サーバー内部のエラー。ネットワーク失敗と同様に限り再試行できる。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalError"
  schemas:
    Id:
      type: string
      format: uuid
      description: サーバーが採番するUUID v7。クライアントは指定しない。
    Timestamp:
      type: string
      format: date-time
      description: UTCのRFC 3339 date-time。表示時のみ閲覧者のブラウザのタイムゾーンへ変換する。
    CalendarDate:
      type: string
      format: date
      description: タイムゾーンを持たない日付（YYYY-MM-DD）。
    Version:
      type: integer
      minimum: 1
      description: 更新競合検出用。作成時1、更新ごとに+1。更新要求で不一致なら409を返す。
    User:
      type: object
      description: 内部User。Google認証主体（AuthAccount.providerAccountId）とは別のIDで、メール変更で別Userを作らない。
      required: [id, name, email, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        avatarUrl:
          type: [string, "null"]
          format: uri
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    WorkspaceCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    WorkspaceUpdate:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        version:
          $ref: "#/components/schemas/Version"
    ProjectUpdate:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        version:
          $ref: "#/components/schemas/Version"
    Workspace:
      type: object
      description: チームが共有する作業領域。共有境界であり、Label・Project・Membershipが属する。
      required: [id, name, createdAt, updatedAt, version]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          minLength: 1
          maxLength: 100
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        version:
          $ref: "#/components/schemas/Version"
    MembershipRole:
      type: string
      enum: [owner, admin, member]
      description: オーナー / 管理者 / メンバー。Workspaceには最低1人のownerを保つ。
    Membership:
      type: object
      description: "(workspaceId, userId) は一意。User削除時とWorkspace削除時は削除される。"
      required: [id, workspaceId, userId, role, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        workspaceId:
          $ref: "#/components/schemas/Id"
        userId:
          $ref: "#/components/schemas/Id"
        role:
          $ref: "#/components/schemas/MembershipRole"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    Project:
      type: object
      required: [id, workspaceId, name, createdAt, updatedAt, version]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        workspaceId:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          minLength: 1
          maxLength: 100
        archivedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        version:
          $ref: "#/components/schemas/Version"
    Roadmap:
      type: object
      description: Project配下のロードマップ。パンくずはWorkspace > Project > Roadmap > 画面の順。
      required: [id, projectId, workspaceId, name, createdBy, createdAt, updatedAt, version]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        projectId:
          $ref: "#/components/schemas/Id"
        workspaceId:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
          maxLength: 2000
        startDate:
          oneOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
          description: 学習を開始する日。
        dueDate:
          oneOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
          description: 完了予定日。開始日以降に設定する。
        archivedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        createdBy:
          $ref: "#/components/schemas/Id"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        version:
          $ref: "#/components/schemas/Version"
    Label:
      type: object
      description: 所属範囲はWorkspace。(workspaceId, name) は一意。別Workspaceのラベルはタスクに付与できない。
      required: [id, workspaceId, name, color, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        workspaceId:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          minLength: 1
          maxLength: 50
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    TaskStatus:
      type: string
      enum: [todo, in_progress, review, done]
      description: 表示名は todo=未着手、in_progress=進行中、review=レビュー、done=完了。ボードの列順もこの順。
    TaskPriority:
      type: string
      enum: [low, medium, high, urgent]
      description: 表示名は low=低、medium=中、high=高、urgent=緊急。
    Task:
      type: object
      description: |
        ボード・タイムライン・マイタスクが共有するTask。
        - 進捗率は保存せず、statusから共通関数で算出する（todo=0、in_progress=33、review=67、done=100）。
        - commentCountは保存せず、Commentの件数から算出する（未作成なら0）。
        - startDateとdueDateは両方ある場合 startDate <= dueDate。片方のみ・未設定を許容する。
        - assigneeIdは同じWorkspaceのMembershipを持つUserに限る。labelIdsは同じWorkspaceのLabelに限る。
        - 一覧はsortOrder昇順、同値はid昇順で並べる。
      required:
        - id
        - roadmapId
        - workspaceId
        - title
        - description
        - status
        - priority
        - assigneeId
        - startDate
        - dueDate
        - labelIds
        - sortOrder
        - commentCount
        - createdBy
        - createdAt
        - updatedAt
        - version
      properties:
        id:
          $ref: "#/components/schemas/Id"
        roadmapId:
          $ref: "#/components/schemas/Id"
        workspaceId:
          $ref: "#/components/schemas/Id"
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 10000
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        startDate:
          oneOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        dueDate:
          oneOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        labelIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
          uniqueItems: true
        sortOrder:
          type: string
          minLength: 1
          description: 同一Roadmap・同一status内の表示順を表す辞書順キー（fractional indexing）。サーバーが採番する。
        commentCount:
          type: integer
          minimum: 0
          readOnly: true
        createdBy:
          $ref: "#/components/schemas/Id"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        version:
          $ref: "#/components/schemas/Version"
    TaskCreate:
      type: object
      description: ID・作成者・監査日時・version・sortOrderは含まない。sortOrderは当該status列の末尾へサーバーが採番する。
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 10000
        status:
          $ref: "#/components/schemas/TaskStatus"
          default: todo
        priority:
          $ref: "#/components/schemas/TaskPriority"
          default: medium
        assigneeId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        startDate:
          oneOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        dueDate:
          oneOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        labelIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
          uniqueItems: true
    TaskUpdate:
      type: object
      description: |
        部分更新。未指定の項目は据え置き、nullは未設定化。versionが現在値と異なれば409を返す。
        列内の並べ替えと列間移動は、移動先の直前・直後のTask IDを送り、statusとsortOrderを1回で原子的に更新する。
      required: [version]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 10000
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        startDate:
          oneOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        dueDate:
          oneOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        labelIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
          uniqueItems: true
        beforeTaskId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
          description: 移動後に直前となるTask。先頭ならnull。
        afterTaskId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
          description: 移動後に直後となるTask。末尾ならnull。
    Comment:
      type: object
      description: Task本体へ埋め込まず別データとして保持する。Task削除時は削除される。
      required: [id, taskId, authorId, body, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        taskId:
          $ref: "#/components/schemas/Id"
        authorId:
          $ref: "#/components/schemas/Id"
        body:
          type: string
          minLength: 1
          maxLength: 5000
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    Member:
      type: object
      description: Workspaceのメンバー。担当者の選択肢に使う。
      required: [user, role]
      properties:
        user:
          $ref: "#/components/schemas/User"
        role:
          $ref: "#/components/schemas/MembershipRole"
    RoadmapCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
          maxLength: 2000
        startDate:
          oneOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        dueDate:
          oneOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
    RoadmapUpdate:
      type: object
      description: 部分更新。未指定の項目は据え置き、descriptionのnullは未設定化。versionが現在値と異なれば409を返す。
      required: [version]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
          maxLength: 2000
        startDate:
          oneOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
          description: 省略は据え置き、nullは未設定化。
        dueDate:
          oneOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
          description: 省略は据え置き、nullは未設定化。
    TaskPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        nextCursor:
          type: [string, "null"]
          description: 次ページがなければnull。
    MyTaskDueFilter:
      type: string
      enum: [overdue, today, thisWeek, noDueDate]
    MyTaskItem:
      type: object
      description: マイタスクの1行。Taskに、遷移と表示に必要な所属情報と担当者を添える。
      required: [task, assignee, workspaceName, projectId, projectName, roadmapName]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        assignee:
          $ref: "#/components/schemas/User"
        workspaceName:
          type: string
        projectId:
          $ref: "#/components/schemas/Id"
        projectName:
          type: string
        roadmapName:
          type: string
    MyTaskSummary:
      type: object
      description: |
        担当タスク全体の集計。検索・絞り込みの条件には影響されない。
        overdueは期限がtodayより前の未完了、dueThisWeekは期限がtoday以降today+6日までの未完了。
      required: [total, todo, inProgress, review, done, overdue, dueThisWeek]
      properties:
        total:
          type: integer
          minimum: 0
        todo:
          type: integer
          minimum: 0
        inProgress:
          type: integer
          minimum: 0
        review:
          type: integer
          minimum: 0
        done:
          type: integer
          minimum: 0
        overdue:
          type: integer
          minimum: 0
        dueThisWeek:
          type: integer
          minimum: 0
    MyTaskPage:
      type: object
      required: [items, page, pageSize, totalCount, summary]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyTaskItem"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalCount:
          type: integer
          minimum: 0
          description: 条件に一致するタスクの総数。
        summary:
          $ref: "#/components/schemas/MyTaskSummary"
    InvitationRole:
      type: string
      enum: [admin, member]
      description: 招待できるのはadminとmember。ownerは招待で付与しない。
    InvitationStatus:
      type: string
      enum: [pending, accepted, revoked, expired]
      description: 表示名は pending=招待中、accepted=参加済み、revoked=取消、expired=期限切れ。
    Invitation:
      type: object
      description: 招待のトークンは保存・返却しない（ハッシュだけを保存する）。
      required: [id, workspaceId, email, role, status, expiresAt, invitedBy, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        workspaceId:
          $ref: "#/components/schemas/Id"
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/InvitationRole"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
        invitedBy:
          $ref: "#/components/schemas/Id"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        acceptedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    InvitationCreate:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: "#/components/schemas/InvitationRole"
    InvitationIssued:
      type: object
      description: 作成・再送の応答。inviteUrlはこのときだけ得られ、受諾画面のURL（相対パス）を含む。
      required: [invitation, inviteUrl, emailSent]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        inviteUrl:
          type: string
        emailSent:
          type: boolean
          description: 招待メールの送信に成功したか。falseでもinviteUrlを共有すれば受諾できる。
    InvitationPreview:
      type: object
      required: [workspaceName, status, expiresAt, emailMatches]
      properties:
        workspaceName:
          type: string
        status:
          $ref: "#/components/schemas/InvitationStatus"
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
        emailMatches:
          type: boolean
          description: ログイン中のユーザーのメールアドレスが、招待先と一致するか。
    InvitationAccepted:
      type: object
      required: [workspaceId, alreadyMember]
      properties:
        workspaceId:
          $ref: "#/components/schemas/Id"
        alreadyMember:
          type: boolean
          description: この呼び出しの前から、同じ招待の受諾により参加済みだったか。
    ErrorCode:
      type: string
      enum: [unauthorized, forbidden, not_found, version_conflict, validation_failed, internal]
    ErrorDetail:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
          description: 入力項目のJSONポインタ（例 /dueDate）。
        message:
          type: string
    UnauthorizedError:
      description: 401の応答本文。
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [unauthorized]
    ForbiddenError:
      description: 403の応答本文。
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [forbidden]
    NotFoundError:
      description: 404の応答本文。
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [not_found]
    VersionConflictError:
      description: 409の応答本文。
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [version_conflict]
    ValidationFailedError:
      description: 422の応答本文。detailsに項目ごとの理由を必ず含む。
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [validation_failed]
    InternalError:
      description: 500の応答本文。
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [internal]
    Error:
      type: object
      description: 共通エラー形式。画面にはmessageをそのまま出さず、codeで文言を決める。
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
