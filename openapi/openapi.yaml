openapi: 3.1.0
info:
  title: Roadmap Studio API
  version: 0.1.0
  description: Roadmap Studioフェーズ1のAPI契約の正本。
servers:
  - url: http://localhost:3000/api
tags:
  - name: Workspaces
    description: 共有境界となるWorkspaceとそのメンバー。
  - name: Projects
    description: Workspace配下のプロジェクト。
  - name: Roadmaps
    description: プロジェクト配下のロードマップ。
  - name: Tasks
    description: ロードマップに属するタスク。ボードとタイムラインが共有する。
  - name: Labels
    description: Workspaceに属するラベル。
security:
  - sessionCookie: []
paths:
  /workspaces:
    get:
      operationId: listWorkspaces
      summary: ログイン中のユーザーが所属するWorkspace一覧
      tags: [Workspaces]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /workspaces/{workspaceId}/members:
    get:
      operationId: listWorkspaceMembers
      summary: Workspaceのメンバー一覧（担当者の選択肢）
      tags: [Workspaces]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/labels:
    get:
      operationId: listLabels
      summary: Workspaceのラベル一覧
      tags: [Labels]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Label"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/projects:
    get:
      operationId: listProjects
      summary: Workspaceのプロジェクト一覧
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/projects/{projectId}/roadmaps:
    get:
      operationId: listRoadmaps
      summary: プロジェクト配下のロードマップ一覧
      tags: [Roadmaps]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Roadmap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createRoadmap
      summary: ロードマップを作成する
      tags: [Roadmaps]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoadmapCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roadmap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /workspaces/{workspaceId}/roadmaps/{roadmapId}:
    get:
      operationId: getRoadmap
      summary: ロードマップを取得する
      tags: [Roadmaps]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RoadmapId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roadmap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateRoadmap
      summary: ロードマップを更新する
      tags: [Roadmaps]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RoadmapId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoadmapUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roadmap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /workspaces/{workspaceId}/roadmaps/{roadmapId}/tasks:
    get:
      operationId: listTasks
      summary: ロードマップのタスク一覧（ボード・タイムライン共通）
      description: sort未指定ならsortOrder昇順（同値はid昇順）。ボードは列ごとにstatusで絞って取得する。
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RoadmapId"
        - name: status
          in: query
          description: 指定したステータスのみ返す。複数指定はOR。
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TaskStatus"
          style: form
          explode: true
        - name: assigneeId
          in: query
          schema:
            $ref: "#/components/schemas/Id"
        - name: labelId
          in: query
          description: 指定したラベルのいずれかを持つタスクのみ返す。
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Id"
          style: form
          explode: true
        - name: q
          in: query
          description: タイトルと説明の部分一致検索。
          schema:
            type: string
            maxLength: 200
        - name: sort
          in: query
          schema:
            type: string
            enum: [sortOrder, dueDate, startDate, priority, createdAt]
            default: sortOrder
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: cursor
          in: query
          description: 前回応答のnextCursor。
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: createTask
      summary: タスクを作成する
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RoadmapId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /workspaces/{workspaceId}/roadmaps/{roadmapId}/tasks/{taskId}:
    get:
      operationId: getTask
      summary: タスクを取得する
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RoadmapId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTask
      summary: タスクを更新する（詳細編集・ステータス変更・列内の並べ替え）
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RoadmapId"
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteTask
      summary: タスクを削除する
      description: 紐づくCommentも削除される。
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RoadmapId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: サーバー側セッションのCookie。Cookie名は認証ライブラリの確定（#13）に合わせて変更する。
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    RoadmapId:
      name: roadmapId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
  responses:
    Unauthorized:
      description: 未認証。画面はログインへ誘導する。再試行しない。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthorizedError"
    Forbidden:
      description: Workspaceのメンバーではない、または権限が足りない。再試行しない。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForbiddenError"
    NotFound:
      description: 対象が存在しない、または閲覧権限のない対象。再試行しない。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundError"
    VersionConflict:
      description: 送信したversionが現在値と異なる。再取得してから操作をやり直す。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VersionConflictError"
    ValidationFailed:
      description: 入力が不正。detailsに項目ごとの理由を返す。再試行しない。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationFailedError"
    InternalError:
      description: サーバー内部のエラー。ネットワーク失敗と同様に限り再試行できる。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalError"
  schemas:
    Id:
      type: string
      format: uuid
      description: サーバーが採番するUUID v7。クライアントは指定しない。
    Timestamp:
      type: string
      format: date-time
      description: UTCのRFC 3339 date-time。表示時のみ閲覧者のブラウザのタイムゾーンへ変換する。
    CalendarDate:
      type: string
      format: date
      description: タイムゾーンを持たない日付（YYYY-MM-DD）。
    Version:
      type: integer
      minimum: 1
      description: 更新競合検出用。作成時1、更新ごとに+1。更新要求で不一致なら409を返す。
    User:
      type: object
      description: 内部User。Google認証主体（AuthAccount.providerAccountId）とは別のIDで、メール変更で別Userを作らない。
      required: [id, name, email, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        avatarUrl:
          type: [string, "null"]
          format: uri
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    Workspace:
      type: object
      description: チームが共有する作業領域。共有境界であり、Label・Project・Membershipが属する。
      required: [id, name, createdAt, updatedAt, version]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          minLength: 1
          maxLength: 100
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        version:
          $ref: "#/components/schemas/Version"
    MembershipRole:
      type: string
      enum: [owner, admin, member]
      description: オーナー / 管理者 / メンバー。Workspaceには最低1人のownerを保つ。
    Membership:
      type: object
      description: "(workspaceId, userId) は一意。User削除時とWorkspace削除時は削除される。"
      required: [id, workspaceId, userId, role, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        workspaceId:
          $ref: "#/components/schemas/Id"
        userId:
          $ref: "#/components/schemas/Id"
        role:
          $ref: "#/components/schemas/MembershipRole"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    Project:
      type: object
      required: [id, workspaceId, name, createdAt, updatedAt, version]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        workspaceId:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          minLength: 1
          maxLength: 100
        archivedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        version:
          $ref: "#/components/schemas/Version"
    Roadmap:
      type: object
      description: Project配下のロードマップ。パンくずはWorkspace > Project > Roadmap > 画面の順。
      required: [id, projectId, workspaceId, name, createdBy, createdAt, updatedAt, version]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        projectId:
          $ref: "#/components/schemas/Id"
        workspaceId:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
          maxLength: 2000
        archivedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        createdBy:
          $ref: "#/components/schemas/Id"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        version:
          $ref: "#/components/schemas/Version"
    Label:
      type: object
      description: 所属範囲はWorkspace。(workspaceId, name) は一意。別Workspaceのラベルはタスクに付与できない。
      required: [id, workspaceId, name, color, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        workspaceId:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          minLength: 1
          maxLength: 50
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    TaskStatus:
      type: string
      enum: [todo, in_progress, review, done]
      description: 表示名は todo=未着手、in_progress=進行中、review=レビュー、done=完了。ボードの列順もこの順。
    TaskPriority:
      type: string
      enum: [low, medium, high, urgent]
      description: 表示名は low=低、medium=中、high=高、urgent=緊急。
    Task:
      type: object
      description: |
        ボード・タイムライン・マイタスクが共有するTask。
        - 進捗率は保存せず、statusから共通関数で算出する（todo=0、in_progress=33、review=67、done=100）。
        - commentCountは保存せず、Commentの件数から算出する（未作成なら0）。
        - startDateとdueDateは両方ある場合 startDate <= dueDate。片方のみ・未設定を許容する。
        - assigneeIdは同じWorkspaceのMembershipを持つUserに限る。labelIdsは同じWorkspaceのLabelに限る。
        - 一覧はsortOrder昇順、同値はid昇順で並べる。
      required:
        - id
        - roadmapId
        - workspaceId
        - title
        - description
        - status
        - priority
        - assigneeId
        - startDate
        - dueDate
        - labelIds
        - sortOrder
        - commentCount
        - createdBy
        - createdAt
        - updatedAt
        - version
      properties:
        id:
          $ref: "#/components/schemas/Id"
        roadmapId:
          $ref: "#/components/schemas/Id"
        workspaceId:
          $ref: "#/components/schemas/Id"
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 10000
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        startDate:
          oneOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        dueDate:
          oneOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        labelIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
          uniqueItems: true
        sortOrder:
          type: string
          minLength: 1
          description: 同一Roadmap・同一status内の表示順を表す辞書順キー（fractional indexing）。サーバーが採番する。
        commentCount:
          type: integer
          minimum: 0
          readOnly: true
        createdBy:
          $ref: "#/components/schemas/Id"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        version:
          $ref: "#/components/schemas/Version"
    TaskCreate:
      type: object
      description: ID・作成者・監査日時・version・sortOrderは含まない。sortOrderは当該status列の末尾へサーバーが採番する。
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 10000
        status:
          $ref: "#/components/schemas/TaskStatus"
          default: todo
        priority:
          $ref: "#/components/schemas/TaskPriority"
          default: medium
        assigneeId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        startDate:
          oneOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        dueDate:
          oneOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        labelIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
          uniqueItems: true
    TaskUpdate:
      type: object
      description: |
        部分更新。未指定の項目は据え置き、nullは未設定化。versionが現在値と異なれば409を返す。
        列内の並べ替えと列間移動は、移動先の直前・直後のTask IDを送り、statusとsortOrderを1回で原子的に更新する。
      required: [version]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 10000
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        startDate:
          oneOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        dueDate:
          oneOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        labelIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
          uniqueItems: true
        beforeTaskId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
          description: 移動後に直前となるTask。先頭ならnull。
        afterTaskId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
          description: 移動後に直後となるTask。末尾ならnull。
    Comment:
      type: object
      description: Task本体へ埋め込まず別データとして保持する。Task削除時は削除される。
      required: [id, taskId, authorId, body, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        taskId:
          $ref: "#/components/schemas/Id"
        authorId:
          $ref: "#/components/schemas/Id"
        body:
          type: string
          minLength: 1
          maxLength: 5000
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    Member:
      type: object
      description: Workspaceのメンバー。担当者の選択肢に使う。
      required: [user, role]
      properties:
        user:
          $ref: "#/components/schemas/User"
        role:
          $ref: "#/components/schemas/MembershipRole"
    RoadmapCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
          maxLength: 2000
    RoadmapUpdate:
      type: object
      description: 部分更新。未指定の項目は据え置き、descriptionのnullは未設定化。versionが現在値と異なれば409を返す。
      required: [version]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
          maxLength: 2000
    TaskPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        nextCursor:
          type: [string, "null"]
          description: 次ページがなければnull。
    ErrorCode:
      type: string
      enum: [unauthorized, forbidden, not_found, version_conflict, validation_failed, internal]
    ErrorDetail:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
          description: 入力項目のJSONポインタ（例 /dueDate）。
        message:
          type: string
    UnauthorizedError:
      description: 401の応答本文。
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [unauthorized]
    ForbiddenError:
      description: 403の応答本文。
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [forbidden]
    NotFoundError:
      description: 404の応答本文。
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [not_found]
    VersionConflictError:
      description: 409の応答本文。
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [version_conflict]
    ValidationFailedError:
      description: 422の応答本文。detailsに項目ごとの理由を必ず含む。
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [validation_failed]
    InternalError:
      description: 500の応答本文。
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [internal]
    Error:
      type: object
      description: 共通エラー形式。画面にはmessageをそのまま出さず、codeで文言を決める。
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
